<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The World Manifesto — Slogans</title>

    <link rel="stylesheet" href="menu.css">

    <style>
        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            line-height: 1.35;
            color: #1a1a1a;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
        }

        main { text-align: center; }

        header {
            text-align: center;
            padding: 20px 0 10px 0;
        }

        header h1 {
            font-size: 30px;
            font-weight: normal;
            margin: 0 0 8px 0;
            color: #8B0000;
            letter-spacing: 0.5px;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: #8B0000;
            margin: 18px auto 24px auto;
            opacity: 0.5;
        }

        .lang-select {
            margin: 0 0 28px 0;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 13px;
            font-family: sans-serif;
            background: #fff;
            cursor: pointer;
            position: sticky;
            top: 0;
            z-index: 400;
        }
        .lang-select:hover { border-color: #888; }
        .lang-select:focus { outline: none; border-color: #8B0000; }

        #slogans-list {
            text-align: left;
            margin: 0 auto;
            max-width: 620px;
        }

        .slogan-item {
            padding: 18px 0 16px 0;
            border-bottom: 1px solid #eee;
            position: relative;
        }

        .slogan-item:first-child {
            border-top: 1px solid #eee;
        }

        .slogan-num {
            display: inline-block;
            font-family: sans-serif;
            font-size: 11px;
            color: #8B0000;
            letter-spacing: 1px;
            margin-bottom: 6px;
            opacity: 0.7;
        }

        .slogan-text {
            font-size: 18px;
            line-height: 1.5;
            color: #333;
            margin: 0 0 10px 0;
        }

        .slogan-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .slogan-copy {
            background: none;
            border: 1px solid #ddd;
            color: #888;
            font-family: sans-serif;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .slogan-copy:hover {
            color: #8B0000;
            border-color: #8B0000;
        }

        .empty-message {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 40px 0;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 40px;
            font-family: sans-serif;
            font-size: 13px;
            color: #666;
            text-decoration: none;
        }
        .back-link:hover { color: #8B0000; }

        [dir="rtl"] .slogan-text { text-align: right; }
        [dir="rtl"] .slogan-actions { justify-content: flex-start; }
        [dir="rtl"] .slogan-num { letter-spacing: normal; }
    </style>

    <link rel="stylesheet" href="background_color.css">
</head>

        const urlParams = new URLSearchParams(window.location.search);
        const rawUrlLang = urlParams.get('lang');
        let currentLang = rawUrlLang ? pickBestLanguage(AVAILABLE, [rawUrlLang]) : pickBestLanguage();

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function switchLanguage(newLang) {
            if (!AVAILABLE.includes(newLang)) newLang = 'en';
            currentLang = newLang;
            const ui = uiTranslations[newLang] || uiTranslations['en'];

            const scrollY = window.scrollY;

            document.getElementById('page-title').textContent = ui.title;
            document.querySelector('.back-link').textContent = ui.back;

            setDocumentDirection(newLang);
            document.getElementById('lang-select').value = newLang;

            loadSlogans(newLang).then(function() {
                window.scrollTo(0, scrollY);
            });
        }

        function loadSlogans(langCode) {
            const container = document.getElementById('slogans-list');
            if (!container) return Promise.resolve();

            const ui = uiTranslations[langCode] || uiTranslations['en'];

            container.innerHTML = '<p class="empty-message">' + escapeHtml(ui.loading) + '</p>';

            return fetch('slogans.json')
                .then(function(response) {
                    if (!response.ok) throw new Error('Kunde inte läsa slogans.json');
                    return response.json();
                })
                .then(function(data) {
                    const langKey = String(langCode).toUpperCase();
                    const slogansData = data[langKey] || data['EN'] || data['SV'] || {};

                    const slogans = Array.isArray(slogansData)
                        ? slogansData
                        : Object.values(slogansData);

                    container.innerHTML = '';

                    if (!slogans || slogans.length === 0) {
                        container.innerHTML = '<p class="empty-message">' + escapeHtml(ui.empty) + '</p>';
                        return;
                    }

                    slogans.forEach(function(text, idx) {
                        const escText = escapeHtml(text);

                        const item = document.createElement('div');
                        item.className = 'slogan-item';
                        item.innerHTML =
                            '<span class="slogan-num">№ ' + String(idx + 1).padStart(2, '0') + '</span>' +
                            '<p class="slogan-text">' + escText + '</p>' +
                            '<div class="slogan-actions">' +
                                '<button class="slogan-copy" data-text="' + encodeURIComponent(text) + '">' + escapeHtml(ui.copy) + '</button>' +
                            '</div>';
                        container.appendChild(item);
                    });

                    container.querySelectorAll('.slogan-copy').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            const text = decodeURIComponent(btn.dataset.text);
                            navigator.clipboard.writeText(text);
                            const old = btn.textContent;
                            btn.textContent = ui.copied;
                            setTimeout(function() { btn.textContent = old; }, 1200);
                        });
                    });
                })
                .catch(function(err) {
                    console.error('Fel vid laddning av slogans:', err);
                    container.innerHTML = '<p class="empty-message">' + escapeHtml(ui.error) + '</p>';
                });
        }

        document.getElementById('lang-select').addEventListener('change', function() {
            const newLang = this.value;
            if (newLang === currentLang) return;

            const url = new URL(window.location);
            url.searchParams.set('lang', newLang);
            history.pushState({ lang: newLang }, '', url);

            switchLanguage(newLang);
        });

        window.addEventListener('popstate', function() {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || pickBestLanguage();
            switchLanguage(lang);
        });
